[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"

[dependencies.sea-orm-migration]
version = "2.0.0-rc"
features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
]
